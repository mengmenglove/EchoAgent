[project]
name = "echo-server"
version = "0.1.0"
description = "EchoAgent backend: FastAPI API + arq worker"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.9",
    "cn2an>=0.5.24",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "soundfile>=0.14.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

# 国内默认走清华镜像。CI（GitHub，在海外）里用 UV_DEFAULT_INDEX 覆盖成官方 PyPI。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数写法

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]
