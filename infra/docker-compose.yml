# 本地开发依赖：Postgres + Redis（+ 可选 MinIO）。
#   docker compose -f infra/docker-compose.yml up -d
# F5-TTS 不放进 Docker：容器里用不了 Apple 芯片的 GPU（MPS），在宿主机原生运行。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # 对象存储（S3 协议）。上线前用它测试 STORAGE_BACKEND=s3，平时可以不启动：
  #   docker compose -f infra/docker-compose.yml --profile s3 up -d
  minio:
    image: minio/minio
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata: {}
  miniodata: {}
